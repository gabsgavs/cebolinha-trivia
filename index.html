<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trívia da Cebolinha 🌱</title>
    <style>
        :root {
            --primary-green: #2E8B57;
            --light-green: #E8F5E9;
            --hover-green: #C8E6C9;
            --earth-brown: #8B4513;
            --text-dark: #333333;
            --bg-color: #F4F7F4;
            --correct: #4CAF50;
            --incorrect: #F44336;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 4px solid var(--primary-green);
        }

        .quiz-content {
            padding: 30px;
        }

        h1 {
            color: var(--primary-green);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--earth-brown);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--light-green);
            border: 2px solid var(--primary-green);
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            color: var(--text-dark);
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--hover-green);
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: var(--correct);
        }

        .option-btn.wrong {
            background-color: var(--incorrect);
            color: white;
            border-color: var(--incorrect);
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback-box.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .feedback-box.error {
            background-color: #FFEBEE;
            border-left: 4px solid var(--incorrect);
            color: #C62828;
        }

        .feedback-box.success {
            background-color: #E8F5E9;
            border-left: 4px solid var(--correct);
            color: #2E7D32;
        }

        .next-btn, .restart-btn {
            background-color: var(--earth-brown);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            display: none;
            transition: background-color 0.3s ease;
        }

        .next-btn:hover, .restart-btn:hover {
            background-color: #6b3410;
        }

        .results {
            text-align: center;
            display: none;
        }

        .results h2 {
            color: var(--primary-green);
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Substitua 'watermarked_img_10223752292266313544.jpg' pelo caminho da sua imagem, se renomear -->
        <img src="capa-cebolinha.jpg" alt="Horta de Cebolinhas" class="header-image">
        
        <div class="quiz-content">
            <h1>Guia de Plantio: Cebolinha 🌱</h1>
            
            <div id="quiz-section">
                <div id="progress" style="text-align: right; color: #666; font-size: 0.9rem; margin-bottom: 10px;"></div>
                <div class="question-text" id="question">Carregando pergunta...</div>
                <div class="options-container" id="options">
                    <!-- Botões gerados via JS -->
                </div>
                
                <div class="feedback-box" id="feedback"></div>
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Próxima Pergunta</button>
            </div>

            <div id="results-section" class="results">
                <h2>Trívia Concluída! 🌻</h2>
                <p id="score-text"></p>
                <button class="restart-btn" id="restart-btn" style="display: block;" onclick="restartQuiz()">Tentar Novamente</button>
            </div>
        </div>
    </div>

    <script>
        // Array com as perguntas, alternativas incorretas geradas e a explicação.
        const questions = [
            {
                question: "1. Posso usar qualquer terra para plantar cebolinha?",
                options: [
                    { text: "Sim, qualquer terra de quintal serve, pois é uma planta rústica.", correct: false },
                    { text: "Não. É importante usar uma terra rica em nutrientes para a semente crescer.", correct: true },
                    { text: "Sim, desde que seja areia pura para não acumular água.", correct: false }
                ],
                explanation: "Para a semente se desenvolver bem e gerar uma planta forte, ela precisa de uma terra bem adubada e rica em nutrientes."
            },
            {
                question: "2. Posso plantar sementes coladas uma na outra?",
                options: [
                    { text: "Não. É importante manter uma distância de pelo menos 10cm entre as sementes.", correct: true },
                    { text: "Sim, elas gostam de crescer juntas para se apoiarem contra o vento.", correct: false },
                    { text: "Sim, a distância não importa para o crescimento das raízes da cebolinha.", correct: false }
                ],
                explanation: "As raízes precisam de espaço para se expandirem. O espaçamento de 10cm evita a competição por nutrientes e água."
            },
            {
                question: "3. Posso plantar Cebolinha o ano inteiro?",
                options: [
                    { text: "Sim, a cebolinha é imune às mudanças de temperatura.", correct: false },
                    { text: "Não, ela só cresce exclusivamente durante o inverno rigoroso.", correct: false },
                    { text: "Depende da região. Regiões muito quentes podem dificultar o crescimento. A planta gosta de terra úmida e sol ameno.", correct: true }
                ],
                explanation: "O calor extremo pode ressecar a planta e dificultar a germinação. O clima ideal é ameno com umidade equilibrada."
            },
            {
                question: "4. Posso deixar a planta o dia inteiro no sol?",
                options: [
                    { text: "Não. O recomendado é 4 horas de sol no máximo, de preferência, sol da manhã e manter a terra úmida.", correct: true },
                    { text: "Sim, quanto mais sol, mais rápido ela cresce e mais verde fica.", correct: false },
                    { text: "Não, a cebolinha deve ficar totalmente na sombra o tempo todo.", correct: false }
                ],
                explanation: "A exposição prolongada ao sol forte pode queimar as folhas delicadas. O sol da manhã por cerca de 4 horas é o ideal."
            },
            {
                question: "5. Quando começo a ver a germinação?",
                options: [
                    { text: "No dia seguinte ao plantio.", correct: false },
                    { text: "Demora cerca de 30 a 40 dias.", correct: false },
                    { text: "Entre 5 a 10 dias.", correct: true }
                ],
                explanation: "Mantendo a terra úmida e em condições ideais, os primeiros brotinhos verdes surgem num prazo de 5 a 10 dias."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const progressEl = document.getElementById('progress');
        const quizSection = document.getElementById('quiz-section');
        const resultsSection = document.getElementById('results-section');
        const scoreText = document.getElementById('score-text');

        // Função para embaralhar as alternativas
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadQuestion() {
            resetState();
            const currentQuestion = questions[currentQuestionIndex];
            
            progressEl.innerText = `Pergunta ${currentQuestionIndex + 1} de ${questions.length}`;
            questionEl.innerText = currentQuestion.question;

            // Criar uma cópia das opções para embaralhar, assim a certa não fica sempre no mesmo lugar
            let shuffledOptions = [...currentQuestion.options];
            shuffleArray(shuffledOptions);

            shuffledOptions.forEach(option => {
                const button = document.createElement('button');
                button.innerText = option.text;
                button.classList.add('option-btn');
                button.addEventListener('click', () => selectAnswer(button, option, currentQuestion.explanation));
                optionsEl.appendChild(button);
            });
        }

        function selectAnswer(selectedButton, option, explanation) {
            const isCorrect = option.correct;
            
            // Desativa todos os botões após a escolha
            Array.from(optionsEl.children).forEach(btn => {
                btn.disabled = true;
            });

            feedbackEl.classList.remove('success', 'error');
            feedbackEl.classList.add('show');

            if (isCorrect) {
                selectedButton.classList.add('correct');
                score++;
                feedbackEl.classList.add('success');
                feedbackEl.innerHTML = `<strong>Correto! 🌱</strong><br>${explanation}`;
            } else {
                selectedButton.classList.add('wrong');
                feedbackEl.classList.add('error');
                feedbackEl.innerHTML = `<strong>Incorreto! 🍂</strong><br>${explanation}`;
                
                // Destaca a correta
                Array.from(optionsEl.children).forEach(btn => {
                    const optionData = questions[currentQuestionIndex].options.find(o => o.text === btn.innerText);
                    if (optionData && optionData.correct) {
                        btn.style.border = "2px solid #4CAF50";
                        btn.style.color = "#4CAF50";
                    }
                });
            }

            nextBtn.style.display = 'block';
        }

        function resetState() {
            nextBtn.style.display = 'none';
            feedbackEl.classList.remove('show');
            while (optionsEl.firstChild) {
                optionsEl.removeChild(optionsEl.firstChild);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizSection.style.display = 'none';
            resultsSection.style.display = 'block';
            scoreText.innerHTML = `Você acertou <strong>${score}</strong> de <strong>${questions.length}</strong> perguntas!<br><br>Seguindo as dicas desta trívia, você estará pronto para ter uma horta de cebolinhas linda.`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            quizSection.style.display = 'block';
            resultsSection.style.display = 'none';
            loadQuestion();
        }

        // Inicia o Quiz
        loadQuestion();
    </script>
</body>
</html>
